name: voidrush

services:
  test:
    container_name: voidrush-test
    build:
      context: ./images/tools/eiffel-compilation
    image: voidrush/tool-eiffel-compilation
    volumes:
      - ./_build:/opt/eiffel/build:rw
      - ..:/opt/eiffel/src:rw
      - voidrush_eifgens_linux:/opt/eiffel/src/EIFGENs
    command: ["test"]

  c-test:
    container_name: voidrush-c-test
    build:
      context: ./images/tools/eiffel-compilation
    image: voidrush/tool-eiffel-compilation
    volumes:
      - ./_build:/opt/eiffel/build:rw
      - ..:/opt/eiffel/src:rw
      - voidrush_eifgens_linux:/opt/eiffel/src/EIFGENs
    command: ["c-test"]

  valgrind:
    container_name: voidrush-valgrind
    build:
      context: ./images/tools/eiffel-compilation
    image: voidrush/tool-eiffel-compilation
    volumes:
      - ./_build:/opt/eiffel/build:rw
      - ..:/opt/eiffel/src:rw
      - voidrush_eifgens_linux:/opt/eiffel/src/EIFGENs
    command: ["valgrind-c"]

  server:
    container_name: voidrush-server
    build:
      context: ./images/tools/eiffel-compilation
    image: voidrush/tool-eiffel-compilation
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"
    volumes:
      - ./_build:/opt/eiffel/build:rw
      - ..:/opt/eiffel/src:rw
      - voidrush_eifgens_linux:/opt/eiffel/src/EIFGENs
    command: ["server"]

  caddy-gate:
    container_name: voidrush-caddy-gate
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server

  haproxy-gate:
    container_name: voidrush-haproxy-gate
    image: haproxy:2.8-alpine
    ports:
      - "8081:80"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - server

volumes:
  voidrush_eifgens_linux:
