global
    maxconn 50000

defaults
    mode http
    timeout connect 5000ms
    timeout client  60000ms
    timeout server  60000ms

frontend http_in
    bind :80
    default_backend voidrush_backend

backend voidrush_backend
    server vr1 server:8080 send-proxy-v2 check inter 2000ms rise 2 fall 3
